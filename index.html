<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>물질 탐정 AI | 우리 주변 물체의 물질 찾기</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#183047;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:780px;margin:36px auto;padding:0 18px}header{text-align:center;margin-bottom:26px}h1{font-size:clamp(28px,5vw,40px);margin:8px 0}header p{color:#607487}.tag{display:inline-block;background:#dff5ed;color:#116b50;padding:7px 14px;border-radius:20px;font-weight:700;font-size:13px}.panel{background:white;border-radius:24px;box-shadow:0 10px 36px #244b6c14;padding:clamp(20px,5vw,40px)}.steps{display:flex;gap:8px;margin-bottom:26px}.step{flex:1;height:8px;border-radius:8px;background:#e2eaf0}.step.active{background:#20a67b}.eyebrow{font-size:14px;font-weight:800;color:#168567}h2{font-size:26px;margin:10px 0}p{line-height:1.65}.muted{color:#607487}.drop{border:2px dashed #a9c7d6;background:#f8fbfd;border-radius:18px;padding:22px;text-align:center;margin:20px 0}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;display:none;margin:10px auto}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.btn{background:#138b70;color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:16px;cursor:pointer}.btn.secondary{background:#e9f1f5;color:#23445b}.btn:disabled{opacity:.4;cursor:not-allowed}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0}.choice{background:#f4f8fb;border:2px solid #dce7ee;color:#183047;border-radius:16px;padding:20px 8px;font-size:18px;font-weight:750;cursor:pointer}.choice.selected{background:#e4f7ef;border-color:#159b75}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.result{background:#effaf5;padding:20px;border-radius:16px;margin:18px 0}.barrow{display:flex;justify-content:space-between;font-size:14px;margin:14px 0 5px}.track{height:12px;background:#e2eaf0;border-radius:10px;overflow:hidden}.fill{height:100%;background:#19a57c;border-radius:10px}.notice{font-size:13px;color:#617787;margin-top:20px}.error{color:#b23b3b}.hide{display:none!important}video{width:100%;max-height:300px;border-radius:12px;background:#111;object-fit:contain}input[type=file]{display:none}@media(max-width:480px){.shell{margin:20px auto}.panel{border-radius:18px}.choice{padding:16px 5px}}
</style>
</head>
<body><main class="shell"><header><span class="tag">초등 3학년 과학 · 물체와 물질</span><h1>🔎 물질 탐정 AI</h1><p>내 생각과 인공지능의 생각을 비교해 보아요!</p></header><section class="panel"><div class="steps"><div class="step active"></div><div class="step"></div><div class="step"></div></div><div id="page"></div><div class="footer"><button id="back" class="btn secondary">← 이전</button><button id="next" class="btn">다음 →</button></div><p id="status" class="notice" role="status" aria-live="polite">AI 모델을 준비하고 있어요…</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
const MODEL_URL='https://teachablemachine.withgoogle.com/models/gWLQCybIp/';
const names=['플라스틱','금속','나무','유리'];const english=['plastic','metal','wood','glass'];
let model=null,step=0,img=null,guess=null,stream=null,predictions=null;
const page=document.querySelector('#page'),status=document.querySelector('#status'),next=document.querySelector('#next'),back=document.querySelector('#back');
function norm(s){const t=String(s).toLowerCase().trim();return english.findIndex((v,i)=>t===v||t===names[i]||t.includes(v)||t.includes(names[i]));}
function friendly(s){const n=norm(s);return n<0?s:names[n];}
function updateButtons(){back.disabled=step===0;next.textContent=step===2?'처음부터 ↺':'다음 →';next.disabled=(step===0&&!img)||(step===1&&!guess);document.querySelectorAll('.step').forEach((el,i)=>el.classList.toggle('active',i<=step));}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function useImage(file){if(!file||!file.type.startsWith('image/')){status.textContent='이미지 파일을 선택해 주세요.';return;}const url=URL.createObjectURL(file);const image=new Image();image.onload=()=>{img=image;stopCamera();render();URL.revokeObjectURL(url);status.textContent='사진이 준비됐어요.';};image.onerror=()=>{URL.revokeObjectURL(url);status.textContent='사진을 열지 못했어요.';};image.src=url;}
function render(){updateButtons();if(step===0){page.innerHTML=`<div class="eyebrow">STEP 1 · 관찰하기</div><h2>물체를 보여주세요!</h2><p class="muted">물체의 주된 물질은 무엇일까요? 사진을 찍거나 업로드해 보세요.</p><div class="drop"><img id="preview" class="preview" alt="선택한 물체 사진"><video id="video" class="hide" autoplay playsinline muted></video><p id="placeholder">📷 관찰할 물체를 준비해 주세요!</p><div class="buttons"><button class="btn secondary" id="camera">카메라 켜기</button><button class="btn secondary" id="capture" hidden>사진 찍기</button><label for="file" class="btn">사진 업로드</label><input type="file" id="file" accept="image/*"></div></div>`;const preview=document.querySelector('#preview');if(img){preview.src=img.src;preview.style.display='block';document.querySelector('#placeholder').hidden=true;}document.querySelector('#file').onchange=e=>useImage(e.target.files[0]);document.querySelector('#camera').onclick=async()=>{try{stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const video=document.querySelector('#video');video.srcObject=stream;video.classList.remove('hide');document.querySelector('#capture').hidden=false;document.querySelector('#placeholder').hidden=true;preview.style.display='none';status.textContent='물체를 화면에 맞추고 사진 찍기를 누르세요.';}catch(e){status.textContent='카메라를 사용할 수 없어요. 브라우저 권한을 확인하거나 사진을 업로드해 주세요.';}};document.querySelector('#capture').onclick=()=>{const video=document.querySelector('#video');if(!video.videoWidth)return;const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.toBlob(useImage,'image/jpeg',.92);};}
else if(step===1){page.innerHTML=`<div class="eyebrow">STEP 2 · 예상하기</div><h2>나는 이렇게 생각해요!</h2><p class="muted">사진 속 물체를 이루는 주된 물질을 골라 보세요.</p><div class="choices">${names.map((n,i)=>`<button class="choice ${guess===i?'selected':''}" data-id="${i}" aria-pressed="${guess===i}">${['🧴','🥄','🪵','🥛'][i]} ${n}</button>`).join('')}</div><p class="notice">AI의 결과를 보기 전에 내 생각을 먼저 선택해요.</p>`;document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{guess=Number(el.dataset.id);render();});}
else{const best=predictions?.[0];const bestIndex=best?norm(best.className):-1;const agree=bestIndex>=0&&bestIndex===guess;page.innerHTML=`<div class="eyebrow">STEP 3 · 비교하기</div><h2>AI는 이렇게 생각했어요!</h2><div class="result"><p>🙋 나의 예상: <strong>${names[guess]}</strong></p><p>🤖 AI의 예상: <strong>${best?friendly(best.className):'분석 중…'}</strong></p><p><strong>${!best?'잠시 기다려 주세요.':bestIndex<0?'AI가 학습한 클래스 이름을 확인해 보세요.':agree?'나와 AI의 생각이 같아요!':'나와 AI의 생각이 달라요!'}</strong></p></div><h3>AI의 예측 확률</h3><div id="bars">${(predictions||[]).map(p=>`<div class="barrow"><span>${friendly(p.className)}</span><strong>${(p.probability*100).toFixed(1)}%</strong></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,p.probability*100))}%"></div></div>`).join('')}</div><p class="notice">AI의 예측 확률은 실제 물질일 확률이나 정답을 보장하지 않아요. 겉모습만으로 재질을 알기 어려운 물체도 있어요.</p>`;}}
next.onclick=async()=>{if(step===2){step=0;img=null;guess=null;predictions=null;render();return;}if(step===0&&!img||step===1&&guess===null)return;step++;render();if(step===2){if(!model){status.textContent='모델을 불러오는 중이에요. 잠시 기다려 주세요.';await loadModel();}if(model){try{predictions=(await model.predict(img)).sort((a,b)=>b.probability-a.probability);status.textContent='분석을 완료했어요.';render();}catch(e){status.textContent='예측 중 문제가 발생했어요: '+e.message;}}}};
back.onclick=()=>{if(step>0){step--;render();}};
async function loadModel(){try{if(!window.tmImage)throw new Error('AI 라이브러리를 불러오지 못했어요.');model=await tmImage.load(MODEL_URL+'model.json',MODEL_URL+'metadata.json');status.textContent='AI 모델 준비 완료!';}catch(e){status.textContent='AI 모델을 불러오지 못했어요. 인터넷 연결과 모델 공개 상태를 확인해 주세요. ('+e.message+')';}}
render();loadModel();window.addEventListener('pagehide',stopCamera);
</script></body></html>
